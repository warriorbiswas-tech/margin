name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for iPad
        run: |
          xcodebuild build \
            -project Margin.xcodeproj \
            -target Margin \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  checks:
    name: Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Geometry
        run: swiftc Margin/Geometry.swift checks/main.swift -o /tmp/margin-check && /tmp/margin-check
      - name: Sync
        run: swiftc Margin/Sync.swift checks/sync/main.swift -o /tmp/sync-check && /tmp/sync-check
      - name: llama.cpp bridge
        run: clang -fsanitize=address,undefined -F Vendor/macos Margin/LlamaEngine.c checks/bridge/fake-llama.c checks/bridge/main.c -o /tmp/bridge && /tmp/bridge
      - name: Assistant
        run: |
          clang -c -fsanitize=thread checks/assistant/engine.c -o /tmp/engine.o
          swiftc -sanitize=thread -import-objc-header checks/assistant/engine.h Margin/Geometry.swift Margin/AI.swift checks/assistant/main.swift /tmp/engine.o -o /tmp/assistant
          /tmp/assistant
      - name: Stress
        run: swiftc -O Margin/Geometry.swift Margin/Sync.swift checks/stress/main.swift -o /tmp/margin-stress && /tmp/margin-stress
