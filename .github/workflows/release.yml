name: Release

# Pushing a tag like v1.2.0 builds both apps and publishes them together as a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ipad:
    name: iPad IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Build
        run: |
          xcodebuild build \
            -project Margin.xcodeproj \
            -target Margin \
            -sdk iphoneos \
            -configuration Release \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO
      - name: Package
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Margin.app Payload/
          test -f Payload/Margin.app/Frameworks/llama.framework/llama
          test -f Payload/Margin.app/Frameworks/whisper.framework/whisper
          zip -qry "Margin-$GITHUB_REF_NAME-iPad.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ipad
          path: Margin-*.ipa

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Require the signing key
        # An update only installs over an APK signed with the same key, so a release never goes out without it.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: test -n "$KEYSTORE"
      - name: Test
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MARGIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MARGIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MARGIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export MARGIN_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          export MARGIN_VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon :app:assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Package
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify "$apk"
          cp "$apk" "Margin-$GITHUB_REF_NAME-Android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: Margin-*.apk

  publish:
    name: Publish
    needs: [ipad, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: release
      - name: Checksums
        working-directory: release
        run: sha256sum Margin-* > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Margin ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
